name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scratch R$F home
        # the runner context is not available in job-level env
        run: echo "RAF_HOME=$RUNNER_TEMP/raf-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Tests (incl. the end-to-end signature workflow and fixture freshness)
        run: uv run pytest -q
      - name: Demo smoke test
        run: |
          uv run raf demo load
          uv run raf status
          uv run raf oracle ask "Explain the most important security path in INC-001" > /dev/null

  postgres:
    name: PostgreSQL (migrations, same results as SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # a throwaway server for this job only, reachable from the runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RAF_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (with the postgres extra)
        run: uv sync --frozen --extra postgres
      - name: Migrations and the SQLite/PostgreSQL equivalence workflow
        run: uv run pytest -q -rs tests/integration/test_postgres.py

  lab:
    name: Lab on a real Docker daemon (isolation checked inside running labs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAF_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Pull the lab default image
        run: docker pull alpine:3.20
      - name: Lab isolation tests
        run: uv run pytest -q -rs -m docker tests/products/test_lab_docker.py

  web:
    name: Web workbench (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: Web workbench end to end (Playwright, Chromium) and the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install R$F (the suite runs .venv/bin/raf, see web/e2e/support/server.ts)
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the workbench and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the workbench (the suite tests what raf serve serves)
        working-directory: web
        run: npm run build
      - name: Wheel with the workbench, checked in a clean environment
        run: ./scripts/check-wheel
      - name: End-to-end tests (demo workspaces, servers on 127.0.0.1)
        working-directory: web
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  tui:
    name: R$F OS terminal panel (fmt, clippy, tests, build, end-to-end dump)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scratch R$F home
        # the runner context is not available in job-level env
        run: echo "RAF_HOME=$RUNNER_TEMP/raf-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Format
        run: cargo fmt --manifest-path tui/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path tui/Cargo.toml --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tui/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path tui/Cargo.toml --release --locked
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: raf tui end to end (Python API → raf-os renderer, every page)
        run: |
          uv sync --frozen
          uv run raf demo load
          uv run pytest -q tests/integration/test_tui_screens.py
          for page in home timeline trace iam blast exposure policy ghost graph oracle findings evidence; do
            uv run raf tui --dump "$page" --width 120 > "$RUNNER_TEMP/$page.txt"
            test -s "$RUNNER_TEMP/$page.txt"
          done
