[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "raf"
description = "R$F (pronounced RAF) - Every security capability. One command away."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "R$F contributors" }]
keywords = ["security", "dfir", "graph", "cyber-range", "exposure", "forensics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
raf = "raf.apps.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/raf/version.py"
pattern = "RAF_VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/raf"]

[tool.hatch.build.targets.sdist]
include = ["src/raf", "README.md", "docs", "fixtures"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PTH", "N", "T20", "BLE"]
ignore = [
    "S101",    # assert is used in tests and for invariants
    "S311",    # random is used for deterministic synthetic data, never for crypto
    "RUF012",  # mutable class attributes are fine for pydantic/typer declarations
    "B008",    # typer/fastapi use function calls in defaults by design
    "PTH123",  # open() is fine where we need explicit modes and limits
    "S603",    # subprocess calls are reviewed individually (no shell=True anywhere)
    "SIM108",
    "N818",    # exception names follow domain language (SecurityViolation, OperationCancelled)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "PTH", "N802", "BLE"]
"scripts/**" = ["T20", "S"]
"src/raf/apps/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["raf"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"
packages = ["raf"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (benchmarks, large datasets)",
    "docker: requires a working Docker daemon",
]
filterwarnings = ["error::DeprecationWarning:raf.*"]

[tool.coverage.run]
source = ["raf"]
branch = true
